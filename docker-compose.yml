services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movielens_app
    ports:
      - "3500:80"
    environment:
      APP_ENV: docker
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: movielens
      DB_USER: movielens
      DB_PASS: movielens
    command: >
      sh -c "if [ ! -f /var/www/html/vendor/autoload.php ]; then
      composer install --prefer-dist --no-interaction --no-progress;
      fi && apache2-foreground"
    volumes:
      - ./:/var/www/html
      - app_vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: movielens_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: movielens
      MYSQL_USER: movielens
      MYSQL_PASSWORD: movielens
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql_data:
  app_vendor:
